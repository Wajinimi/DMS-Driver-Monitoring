<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DMS Driver Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      background: #0f172a;
      color: #e2e8f0;
    }
    h1 { margin-bottom: 4px; }
    p { color: #94a3b8; }
    .hint { font-size: 14px; margin-bottom: 16px; }
    .chart-box {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      max-width: 900px;
      position: relative;
      height: 420px;
      margin-bottom: 24px;
    }
    #plot2Section {
      display: none;
      margin-top: 8px;
    }
    #plot2Title {
      margin-bottom: 8px;
      color: #e2e8f0;
    }
    #errorBox {
      display: none;
      margin-top: 12px;
      padding: 12px;
      background: #7f1d1d;
      border-radius: 8px;
      color: #fecaca;
    }

    .score-card {
      background: #1e293b;
      padding: 20px 24px;
      border-radius: 12px;
      max-width: 900px;
      margin-bottom: 24px;
      border-left: 4px solid #38bdf8;
    }
    .score-value {
      font-size: 42px;
      font-weight: bold;
      margin: 8px 0;
    }
    .score-band { color: #38bdf8; font-size: 18px; }
    .score-meta { color: #64748b; font-size: 13px; margin-top: 4px; }
    .contributors { margin-top: 12px; color: #94a3b8; font-size: 14px; list-style: none; padding: 0; }
    .contributors li { margin: 4px 0; }
    .coaching-card {
      background: #1e293b;
      padding: 20px 24px;
      border-radius: 12px;
      max-width: 900px;
      margin-bottom: 24px;
      border-left: 4px solid #22c55e;
    }
    .coaching-card h2 {
      margin: 0 0 12px 0;
      font-size: 18px;
      color: #e2e8f0;
    }
    .coaching-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .coaching-list li {
      margin: 10px 0;
      padding: 10px 12px;
      background: #0f172a;
      border-radius: 8px;
      color: #cbd5e1;
      font-size: 14px;
    }
    .coaching-rule {
      display: block;
      font-size: 11px;
      color: #64748b;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <h1>Driver Distraction Dashboard</h1>
  <p>Plot 1 — Total minutes distracted (last 7 days)</p>
  <p class="hint">Click a day bar to see activity breakdown (Plot 2).</p>

  <div class="score-card" id="scoreCard">
    <p>Weekly Safety Score</p>
    <div class="score-value" id="scoreValue">—</div>
    <div class="score-band" id="scoreBand">Loading…</div>
    <div class="score-meta" id="scoreWeek"></div>
    <ul class="contributors" id="topContributors"></ul>
  </div>

  <div class="coaching-card" id="coachingCard">
    <h2>Weekly Coaching</h2>
    <ul class="coaching-list" id="coachingList">
      <li>Loading coaching tips…</li>
    </ul>
  </div>

  <div class="chart-box">
    <canvas id="weekChart"></canvas>
  </div>

  <div id="plot2Section">
    <h2 id="plot2Title">Plot 2 — Activity breakdown</h2>
    <div class="chart-box">
      <canvas id="dayChart"></canvas>
    </div>
  </div>

  <div id="errorBox"></div>

  <script>
    let dayDates = [];
    let dayChart = null;

    function showError(message) {
      const box = document.getElementById("errorBox");
      box.style.display = "block";
      box.textContent = message;
    }

    function chartOptions(yLabel) {
      return {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: {
            beginAtZero: true,
            title: { display: true, text: yLabel, color: "#e2e8f0" },
            ticks: { color: "#e2e8f0" },
            grid: { color: "#334155" }
          },
          x: {
            ticks: { color: "#e2e8f0" },
            grid: { color: "#334155" }
          }
        },
        plugins: {
          legend: { labels: { color: "#e2e8f0" } }
        }
      };
    }

    async function loadDayChart(dateStr, weekdayLabel) {
      const resp = await fetch("/api/day/" + dateStr);
      if (!resp.ok) {
        showError("API error: /api/day/" + dateStr + " returned " + resp.status);
        return;
      }

      const data = await resp.json();
      const activities = data.activities || [];

      document.getElementById("plot2Section").style.display = "block";
      document.getElementById("plot2Title").textContent =
        "Plot 2 — " + weekdayLabel + " " + dateStr + " (by activity)";

      const labels = activities.map(function (a) { return a.activity; });
      const values = activities.map(function (a) { return a.minutes; });

      if (dayChart) {
        dayChart.destroy();
      }

      dayChart = new Chart(document.getElementById("dayChart"), {
        type: "bar",
        data: {
          labels: labels.length ? labels : ["No distractions"],
          datasets: [{
            label: "Minutes distracted",
            data: values.length ? values : [0],
            backgroundColor: "#f97316",
            minBarLength: 8,
          }]
        },
        options: chartOptions("Minutes")
      });

      document.getElementById("plot2Section").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    async function loadWeekChart() {
      try {
        if (typeof Chart === "undefined") {
          showError("Chart.js did not load. Check your internet connection and refresh.");
          return;
        }

        const resp = await fetch("/api/week");
        if (!resp.ok) {
          showError("API error: /api/week returned " + resp.status);
          return;
        }

        const data = await resp.json();
        if (!data.days || !data.days.length) {
          showError("No day data returned from /api/week");
          return;
        }

        dayDates = data.days.map(function (d) { return d.date; });
        const labels = data.days.map(function (d) { return d.weekday; });
        const values = data.days.map(function (d) { return d.total_distraction_minutes; });

        new Chart(document.getElementById("weekChart"), {
          type: "bar",
          data: {
            labels: labels,
            datasets: [{
              label: "Minutes distracted",
              data: values,
              backgroundColor: "#38bdf8",
              minBarLength: 8,
            }]
          },
          options: {
            ...chartOptions("Minutes"),
            onHover: function (event, elements) {
              event.native.target.style.cursor = elements.length ? "pointer" : "default";
            },
            onClick: function (event, _elements, chart) {
              // I treat the whole day column as clickable, not just the tiny bar.
              const points = chart.getElementsAtEventForMode(
                event, "index", { intersect: false }, true
              );
              if (!points.length) {
                return;
              }
              const index = points[0].index;
              loadDayChart(dayDates[index], labels[index]);
            },
            plugins: {
              ...chartOptions("Minutes").plugins,
              tooltip: {
                callbacks: {
                  footer: function () {
                    return "Click anywhere in this column";
                  }
                }
              }
            }
          }
        });
      } catch (err) {
        showError("Chart failed: " + err.message);
        console.error(err);
      }
    }

    async function loadWeeklyScore() {
      try {
        const resp = await fetch("/api/weekly-report");
        if (!resp.ok) {
          document.getElementById("scoreBand").textContent = "Could not load score";
          return;
        }

        const report = await resp.json();
        document.getElementById("scoreWeek").textContent =
          report.week_start + " → " + report.week_end;

        if (!report.has_data) {
          document.getElementById("scoreValue").textContent = "—";
          document.getElementById("scoreBand").textContent = "No data this week";
          document.getElementById("topContributors").innerHTML = "";
          return;
        }

        document.getElementById("scoreValue").textContent =
          report.safety_score + " /100";
        document.getElementById("scoreBand").textContent = report.band;

        const list = document.getElementById("topContributors");
        list.innerHTML = "";
        (report.top_contributors || []).forEach(function (item) {
          const li = document.createElement("li");
          li.textContent =
            item.behavior + ": " + item.contribution +
            " pts (" + item.pct_of_total_risk + "% of risk)";
          list.appendChild(li);
        });
      } catch (err) {
        document.getElementById("scoreBand").textContent = "Score load failed";
        console.error(err);
      }
    }

    async function loadWeeklyCoaching() {
      try {
        // I call the Phase 10 API to get score rules, tips, and trend messages
        const resp = await fetch("/api/weekly-coaching");
        if (!resp.ok) {
          document.getElementById("coachingList").innerHTML =
            "<li>Could not load coaching tips</li>";
          return;
        }

        const data = await resp.json();
        const list = document.getElementById("coachingList");
        list.innerHTML = "";

        const recs = data.recommendations || [];
        if (!recs.length) {
          list.innerHTML = "<li>No coaching tips for this week.</li>";
          return;
        }

        // I show each message and which rule fired so coaching stays explainable
        recs.forEach(function (rec) {
          const li = document.createElement("li");
          const ruleSpan = document.createElement("span");
          ruleSpan.className = "coaching-rule";
          ruleSpan.textContent = rec.rule;
          li.appendChild(ruleSpan);
          li.appendChild(document.createTextNode(rec.message));
          list.appendChild(li);
        });
      } catch (err) {
        document.getElementById("coachingList").innerHTML =
          "<li>Coaching load failed</li>";
        console.error(err);
      }
    }

    loadWeeklyScore();
    loadWeeklyCoaching();
    loadWeekChart();
  </script>
</body>
</html>
